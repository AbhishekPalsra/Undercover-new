<text x="145.0" y="220" font-size="14" fill="#073B4C" text-anchor="middle">React + TypeScript</text>
<rect x="345" y="145" width="235" height="95" rx="12" fill="#FFEDC2"/>
<text x="462.5" y="174" font-size="17" font-weight="700" text-anchor="middle">Backend</text>
<text x="462.5" y="199" font-size="14" fill="#073B4C" text-anchor="middle">The rules and service desk</text>
<text x="462.5" y="220" font-size="14" fill="#073B4C" text-anchor="middle">FastAPI</text>
<rect x="345" y="380" width="235" height="95" rx="12" fill="#FFE0D4"/>
<text x="462.5" y="409" font-size="17" font-weight="700" text-anchor="middle">AI agent</text>
<text x="462.5" y="434" font-size="14" fill="#073B4C" text-anchor="middle">The claim reviewer</text>
<text x="462.5" y="455" font-size="14" fill="#073B4C" text-anchor="middle">LangChain + API tools</text>
<rect x="650" y="145" width="180" height="95" rx="12" fill="#FFFFFF"/>
