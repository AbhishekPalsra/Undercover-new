<text x="740.0" y="309" font-size="17" font-weight="700" text-anchor="middle">Seed files</text>
<text x="740.0" y="334" font-size="14" fill="#073B4C" text-anchor="middle">The starting records</text>
<text x="740.0" y="355" font-size="14" fill="#073B4C" text-anchor="middle">Loaded once</text>
