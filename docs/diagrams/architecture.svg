<text x="735" y="473" font-size="13" fill="#456671" text-anchor="middle">Replies / tool choices</text>
<text x="45" y="529" font-size="14" fill="#456671" text-anchor="start">The agent runs locally; the language model is reached over the internet.</text>
<text x="32" y="588" font-size="14" fill="#456671" text-anchor="start">The browser never receives the OpenRouter key. The backend controls saved decisions and simulated payments.</text>
