<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 610" role="img" aria-labelledby="title desc">
<title id="title">The project at a glance</title><desc id="desc">The handler uses a website. The backend reads SQLite, starts the local agent and enforces payment controls. The agent uses backend tools and sends model requests through OpenRouter. Seed files initialize SQLite.</desc>
