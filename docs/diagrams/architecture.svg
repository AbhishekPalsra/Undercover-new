<polyline points="740,280 740,240" fill="none" stroke="#456671" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="790" y="264" font-size="13" fill="#456671" text-anchor="middle">First startup</text>
