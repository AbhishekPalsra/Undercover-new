<rect x="24" y="70" width="830" height="490" rx="14" fill="#E2ECEF"/>
<text x="45" y="98" font-size="12" fill="#456671" text-anchor="start">ON YOUR COMPUTER</text>
<rect x="50" y="145" width="190" height="95" rx="12" fill="#C8F4E8"/>
<text x="145.0" y="174" font-size="17" font-weight="700" text-anchor="middle">Website</text>
