<text x="1002.5" y="409" font-size="17" font-weight="700" text-anchor="middle">OpenRouter + model</text>
<text x="1002.5" y="434" font-size="14" fill="#073B4C" text-anchor="middle">External AI service</text>
<text x="1002.5" y="455" font-size="14" fill="#073B4C" text-anchor="middle">Reads / chooses tool calls</text>
